<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness · 租户平台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; display: flex; height: 100vh; }
  #side { width: 240px; border-right: 1px solid rgba(128,128,128,.35); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #side h1 { font-size: 15px; margin: 0 0 4px; }
  #side ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #side li { padding: 6px 8px; border-radius: 6px; cursor: pointer; word-break: break-all; }
  #side li[aria-current="true"] { background: rgba(128,128,128,.25); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { white-space: pre-wrap; word-break: break-word; max-width: 72ch; padding: 6px 10px; border-radius: 8px; background: rgba(128,128,128,.15); }
  .msg.user { align-self: flex-end; background: rgba(64,120,220,.25); }
  .raw { font: 11px/1.4 ui-monospace, monospace; opacity: .75; align-self: flex-start; }
  .permission { border: 1px solid rgba(200,140,40,.6); border-radius: 8px; padding: 8px 10px; align-self: stretch; }
  .permission button { margin-right: 8px; }
  #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(128,128,128,.35); }
  #composer textarea { flex: 1; resize: vertical; min-height: 44px; font: inherit; }
  #bar { padding: 12px; border-bottom: 1px solid rgba(128,128,128,.35); display: flex; gap: 8px; align-items: center; }
  #bar input { flex: 1; font: inherit; padding: 4px 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<aside id="side">
  <h1>租户会话</h1>
  <div><button id="refresh">刷新列表</button> <button id="new-session">新建会话</button></div>
  <label>workspace 路径 <input id="cwd" placeholder="/absolute/path" style="width:100%"></label>
  <ul id="sessions"></ul>
</aside>
<main id="main">
  <div id="bar">
    <label>访问令牌 <input id="token" type="password" placeholder="tenant token"></label>
    <button id="connect">连接</button>
    <span id="status"></span>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="composer" hidden>
    <textarea id="prompt" placeholder="给 agent 发消息…"></textarea>
    <button type="submit">发送</button>
  </form>
</main>
<script src="./portal.js"></script>
</body>
</html>
