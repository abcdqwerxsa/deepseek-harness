<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness · 管理控制台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
  #bar { padding: 12px 16px; border-bottom: 1px solid rgba(128,128,128,.35); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar input { font: inherit; padding: 4px 8px; width: 280px; }
  #bar .who { opacity: .8; }
  #views { padding: 16px; display: flex; flex-direction: column; gap: 20px; max-width: 920px; }
  section h2 { font-size: 15px; margin: 0 0 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid rgba(128,128,128,.25); word-break: break-all; }
  ul.audit { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; font: 12px/1.5 ui-monospace, monospace; }
  ul.audit li { padding: 2px 4px; border-bottom: 1px solid rgba(128,128,128,.15); }
  .card { display: inline-block; border: 1px solid rgba(128,128,128,.4); border-radius: 8px; padding: 10px 14px; margin: 0 8px 8px 0; }
  .card b { font-size: 20px; display: block; }
  .open-ui { font-size: 15px; padding: 8px 14px; }
  [hidden] { display: none !important; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<div id="bar">
  <label>访问令牌 <input id="token" type="password" placeholder="platform token"></label>
  <button id="connect">进入</button>
  <span id="status" class="who"></span>
</div>
<div id="views" hidden></div>
<script src="./portal.js"></script>
</body>
</html>
