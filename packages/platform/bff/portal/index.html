<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Harness · 企业通用智能体工作台</title>
  <link rel="stylesheet" href="./portal.css">
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>DSH Mission Cockpit</span>
      </div>
      <div id="dept-badge" class="badge badge-blue" hidden>
        <span id="dept-name">Dept</span>
      </div>
      <div id="sandbox-badge" class="badge badge-green" hidden>
        <span>● 沙箱隔离就绪</span>
      </div>
    </div>
    <div class="header-right">
      <button id="admin-btn" class="btn btn-sm" hidden>⚙️ 管理控制台</button>
      <div id="user-info" class="badge badge-blue" hidden>
        <span id="user-name">User</span>
      </div>
      <button id="logout-btn" class="btn btn-sm" hidden>退出</button>
    </div>
  </header>

  <!-- Login Overlay -->
  <main id="auth-banner">
    <div class="login-card">
      <h2>企业智能体工作台</h2>
      <p>请输入平台访问令牌以连接专属沙盒运行环境</p>
      <div class="login-form">
        <input id="token-input" class="input-text" type="password" placeholder="输入 Platform Access Token" autocomplete="off">
        <button id="login-btn" class="btn btn-primary">立即连接工作台</button>
        <div id="auth-error" class="badge badge-amber" style="display:none; justify-content:center;"></div>
      </div>
    </div>
  </main>

  <!-- Main Three-Column Workspace Layout -->
  <div id="workspace-layout" hidden>
    <!-- Column 1: Task History -->
    <aside class="tasks-column">
      <div class="column-header">
        <h3>当前任务会话</h3>
        <button id="new-task-btn" class="btn btn-primary btn-sm">+ 新建任务</button>
      </div>
      <div id="task-list" class="task-list">
        <!-- Dynamically rendered task cards -->
      </div>
    </aside>

    <!-- Column 2: Ongoing Chat & Interaction -->
    <section class="chat-column">
      <div id="chat-messages" class="chat-messages">
        <!-- Message bubbles, Thought Flow, Tools, and Markdown answers -->
      </div>

      <div class="chat-input-container">
        <div class="chat-input-box">
          <textarea id="chat-input" class="chat-textarea" rows="2" placeholder="输入任务指令，或拖拽业务文件投喂给智能体 (Enter 发送，Shift+Enter 换行)..."></textarea>
          <input type="file" id="file-upload-input" style="display:none">
          <button id="attach-btn" class="btn btn-sm" title="上传附件">📎</button>
          <button id="send-btn" class="btn btn-primary btn-sm">发送</button>
        </div>
      </div>
    </section>

    <!-- Column 3: Deliverables & Files -->
    <aside class="deliverables-column">
      <div class="column-header">
        <h3>交付成果与文件</h3>
        <button id="refresh-files-btn" class="btn btn-sm" title="刷新文件列表">🔄</button>
      </div>
      <div class="deliverables-content">
        <!-- Drag and drop zone -->
        <div id="upload-dropzone" class="upload-dropzone">
          <div class="upload-icon">📁</div>
          <div class="upload-text">点击或拖拽业务文件到此处上传</div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">支持 Excel, CSV, PDF, Markdown 等</div>
        </div>

        <!-- Files list -->
        <div class="column-header" style="padding:0; border:none;">
          <h3 style="font-size:12px;">工作区产物列表</h3>
        </div>
        <div id="file-list" class="file-list">
          <!-- Dynamically populated files -->
        </div>
      </div>
    </aside>
  </div>

  <!-- Admin Console Modal -->
  <div id="admin-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2 style="font-size:16px;">🏢 平台与部门管理控制台</h2>
        <button id="admin-close-btn" class="btn btn-sm">✕ 关闭</button>
      </div>
      <div id="admin-modal-body" class="modal-body">
        <!-- Injected admin overview / directory / usage / audit -->
      </div>
    </div>
  </div>

  <script src="./portal.js"></script>
</body>
</html>
