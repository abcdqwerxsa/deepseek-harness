name: dsh-platform

services:
  platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Neutralize the host-wide 127.0.0.1 proxy injected from the Docker
        # client config: unreachable inside build containers on this network.
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        all_proxy: ""
        ALL_PROXY: ""
    env_file: .env
    environment:
      # Inside the compose network the gateway reaches the platform directly;
      # binding all interfaces is contained by the network, not the host.
      PLATFORM_HOST: 0.0.0.0
      PLATFORM_PORT: "8080"
      PLATFORM_TENANTS_ROOT: /data/tenants
      PLATFORM_DB: /data/platform.sqlite
    volumes:
      - platform-data:/data
    # The converged bwrap isolation needs unprivileged user namespaces,
    # which Docker's default seccomp profile denies. This grant is required
    # only when PLATFORM_ISOLATION is enabled.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]
    restart: unless-stopped

  gateway:
    image: docker.m.daocloud.io/library/caddy:2
    depends_on: [platform]
    ports:
      - "${GATEWAY_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    restart: unless-stopped

volumes:
  platform-data:
  caddy-data:
  caddy-config:

networks:
  internal:
